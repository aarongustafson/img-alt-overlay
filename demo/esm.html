<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>img-alt-overlay via esm.sh</title>
		<link rel="stylesheet" href="./styles.css" />
		<style>
			/* Demo-specific styles */
		</style>
	</head>
	<body>
		<h1>esm.sh CDN sanity check</h1>
		<p>
			This page loads the component class from <code>esm.sh</code> and
			registers it manually.
		</p>

		<img-alt-overlay>
			<p>Replace this markup once you customize img-alt-overlay.</p>
		</img-alt-overlay>

		<script type="module">
			import { ImgAltOverlayElement } from 'https://esm.sh/@aarongustafson/img-alt-overlay@0.0.1/img-alt-overlay.js?bundle&target=es2022';

			if (!customElements.get('img-alt-overlay')) {
				customElements.define('img-alt-overlay', ImgAltOverlayElement);
			}
		</script>
	</body>
</html>
